<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fbf8f3; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .slot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .slot .panel { position: absolute; inset: 0; padding-top: 285px; }
      .crema { background: #fbf8f3; } .marron { background: #1b1512; }
      .slot img { display: block; width: 1080px; height: 1350px; }
    </style>
  </head>
  <body>
    <!-- Láminas: cada cambio cae en un golpe de la música (pulso cada 1,33 s). Portada 3,4 s, pasos 4 s, cierre 3 s. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="18.4" data-width="1080" data-height="1920">
            <div id="sl1" class="clip slot" data-start="0" data-duration="3.88" data-track-index="1"><div id="pn1" class="panel crema"><img id="im1" src="assets/post-02-slide-1.png" alt="" /></div></div>
      <div id="sl2" class="clip slot" data-start="3.43" data-duration="4.45" data-track-index="2"><div id="pn2" class="panel marron"><img id="im2" src="assets/post-02-slide-2.png" alt="" /></div></div>
      <div id="sl3" class="clip slot" data-start="7.43" data-duration="4.45" data-track-index="1"><div id="pn3" class="panel crema"><img id="im3" src="assets/post-02-slide-3.png" alt="" /></div></div>
      <div id="sl4" class="clip slot" data-start="11.43" data-duration="4.45" data-track-index="2"><div id="pn4" class="panel marron"><img id="im4" src="assets/post-02-slide-4.png" alt="" /></div></div>
      <div id="sl5" class="clip slot" data-start="15.43" data-duration="2.97" data-track-index="1"><div id="pn5" class="panel crema"><img id="im5" src="assets/post-02-slide-5.png" alt="" /></div></div>
      <audio id="musica" data-timeline-role="music" src="assets/musica-v2.mp3" data-start="0" data-duration="15.6" data-media-start="0.6" data-track-index="10" data-volume="0.9"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.6},{"t":1.2,"v":1},{"t":15.2,"v":1},{"t":15.6,"v":0}]}]}'></audio>
      <audio id="musica-cola" src="assets/musica-v2.mp3" data-start="15.2" data-duration="3.2" data-media-start="5.136" data-track-index="11" data-volume="0.9"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.4,"v":1},{"t":1.7,"v":1},{"t":3.2,"v":0}]}]}'></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const T = 0.45; // duración del deslizamiento
      const EASE = "power3.inOut";
      
      // Portada: entra con un leve zoom
      tl.fromTo("#im1", { scale: 1.06, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, 0);

      // Cambio de lámina: la actual sale a la izquierda, la siguiente entra desde la derecha
      const cuts = [
        [3.43, "#pn1", "#pn2"],
        [7.43, "#pn2", "#pn3"],
        [11.43, "#pn3", "#pn4"],
        [15.43, "#pn4", "#pn5"],
      ];
      for (const [t, out, inn] of cuts) {
        tl.fromTo(out, { x: 0 }, { x: -1080, duration: T, ease: EASE }, t);
        tl.fromTo(inn, { x: 1080 }, { x: 0, duration: T, ease: EASE }, t);
      }

      // Leve respiración en cada paso mientras se lee
      tl.fromTo("#im2", { scale: 1 }, { scale: 1.02, duration: 3.5, ease: "none" }, 3.88);
      tl.fromTo("#im3", { scale: 1 }, { scale: 1.02, duration: 3.5, ease: "none" }, 7.88);
      tl.fromTo("#im4", { scale: 1 }, { scale: 1.02, duration: 3.5, ease: "none" }, 11.88);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
