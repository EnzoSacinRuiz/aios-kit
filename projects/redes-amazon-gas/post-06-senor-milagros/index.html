<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url("assets/BarlowCondensed-SemiBold.ttf"); }
      @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url("assets/BarlowCondensed-ExtraBold.ttf"); }
      @font-face { font-family: "Inter"; font-weight: 100 900; src: url("assets/Inter.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1b1512; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1b1512; font-family: "Inter", sans-serif; color: #fbf8f3; }
      #cam { position: absolute; left: 0; right: 0; top: 560px; bottom: 0; overflow: hidden; }
      #velas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 70%; }
      #velo { position: absolute; inset: 0;
        background:
          linear-gradient(180deg, rgba(27,21,18,1) 0%, rgba(27,21,18,1) 22%, rgba(27,21,18,.8) 33%, rgba(27,21,18,.25) 46%, rgba(27,21,18,0) 55%),
          linear-gradient(0deg, rgba(27,21,18,.92) 0%, rgba(27,21,18,.5) 14%, rgba(27,21,18,0) 30%); }
      #texto { position: absolute; left: 90px; right: 90px; top: 300px; text-align: center; }
      #fecha { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 40px; letter-spacing: .32em; text-transform: uppercase; color: #c9bdb0; }
      #linea { width: 100px; height: 3px; background: #8e4149; margin: 34px auto 38px; }
      #titulo { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 150px; line-height: .92; letter-spacing: .01em; max-width: 920px; margin: 0 auto; }
      #frase { margin: 44px auto 0; max-width: 800px; font-size: 46px; line-height: 1.35; color: #fbf8f3; }
      #firma { position: absolute; left: 0; right: 0; bottom: 430px; display: flex; justify-content: center; }
      #placa { background: #fbf8f3; border-radius: 4px; padding: 16px 26px 14px; box-shadow: 0 10px 28px rgba(0,0,0,.5); }
      #placa img { display: block; height: 110px; }
      #negro { position: absolute; inset: 0; background: #000; }
      #oscuro { position: absolute; inset: 0; background: #000; }
    </style>
  </head>
  <body>
    <!-- Post 6 · Señor de los Milagros · versión genérica (no afirma participación en la procesión). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="cam">
        <video id="velas" src="assets/velas.mp4" data-start="0" data-duration="10" data-media-start="0" data-playback-rate="0.5" data-track-index="0" data-layout-allow-overflow muted playsinline></video>
      </div>
      <div id="velo"></div>
      <div id="oscuro"></div>
      <div id="texto">
        <div id="fecha">18 de octubre</div>
        <div id="linea"></div>
        <div id="titulo">Señor de los Milagros</div>
        <div id="frase">Con fe y respeto, saludamos a todas las familias de Loreto en este día.</div>
      </div>
      <div id="firma"><div id="placa"><img src="assets/logo.png" alt="Amazon Gas" /></div></div>
      <div id="negro"></div>
      <audio id="musica" data-timeline-role="music" src="assets/musica.mp3" data-start="0" data-duration="10" data-track-index="10" data-volume="0.85"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":1.2,"v":1},{"t":8.4,"v":1},{"t":10,"v":0}]}]}'></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // Entrada desde negro y acercamiento lento, casi imperceptible
      tl.fromTo("#negro", { opacity: 1 }, { opacity: 0, duration: 1.4, ease: "power1.out" }, 0);
      tl.fromTo("#velas", { scale: 1.0 }, { scale: 1.08, duration: 10, ease: "none" }, 0);
      // Texto, en calma
      tl.fromTo("#fecha", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 1.0, ease: "power2.out" }, 0.9);
      tl.fromTo("#linea", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, 1.4);
      tl.fromTo("#titulo", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1.4, ease: "power2.out" }, 1.9);
      tl.fromTo("#frase", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 1.3, ease: "power2.out" }, 3.6);
      tl.fromTo("#placa", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.2, ease: "power2.out" }, 5.6);
      // Cierre suave
      tl.fromTo("#oscuro", { opacity: 0 }, { opacity: 0.5, duration: 1.4, ease: "power1.in" }, 8.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
